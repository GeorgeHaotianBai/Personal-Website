<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1f4d46">
  <title>George Bai</title>
  <meta name="description" content="This website is under construction.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #f7f3ea;
      --ink: #172622;
      --muted: #65716c;
      --accent: #1f4d46;
      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem 1.5rem;
      color: var(--ink);
      background: var(--bg);
      font-family: var(--sans);
      font-size: 1rem;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 32rem; text-align: center; }
    h1 {
      margin: 0 0 1rem;
      font-family: var(--serif);
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 700;
      letter-spacing: .01em;
      line-height: 1.2;
    }
    hr {
      width: 3rem;
      height: 2px;
      margin: 0 auto 1.25rem;
      border: 0;
      background: var(--accent);
    }
    p { margin: 0 0 .5rem; }
    .status { font-size: 1.125rem; }
    .contact { color: var(--muted); }
    a { color: var(--accent); text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: .2em; }
  </style>
</head>
<body>
  <main>
    <h1>George Bai</h1>
    <hr>
    <p class="status">This website is under construction.</p>
    <p class="contact">Write to me at <a href="mailto:georgeht@mit.edu">georgeht@mit.edu</a>.</p>
  </main>
</body>
</html>
